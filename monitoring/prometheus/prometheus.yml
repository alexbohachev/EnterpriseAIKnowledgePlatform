global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'eakp-api'
    metrics_path: '/internal/metrics'
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'eakp-api'
rule_files:
  - /etc/prometheus/rules/eakp-alerts.yml
