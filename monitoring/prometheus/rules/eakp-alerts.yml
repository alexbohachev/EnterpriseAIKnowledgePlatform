groups:
  - name: eakp
    rules:
      - alert: EAKPHighHTTPErrorRatio
        expr: sum(rate(eakp_http_requests_total{status_class=~"5xx"}[5m])) / clamp_min(sum(rate(eakp_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EAKP 5xx ratio above 5 percent"
      - alert: EAKPHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(eakp_http_request_duration_seconds_bucket{route="/api/v1/query"}[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EAKP /query p95 HTTP latency above 5 seconds"
      - alert: EAKPHighGenerationErrorRatio
        expr: sum(rate(eakp_rag_stage_duration_seconds_count{stage="generation",outcome="error"}[5m])) / clamp_min(sum(rate(eakp_rag_stage_duration_seconds_count{stage="generation"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EAKP LLM generation errors above 5 percent"
