[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.rag"]

[project]
name = "enterprise-ai-knowledge-platform"
version = "0.8.0"
description = "OTUS Architect AI/ML — Stage 8 OCR and acceptance hardening for local GraphRAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "SQLAlchemy==2.0.50",
  "alembic==1.18.4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3",
  "pypdf>=5.9,<6",
  "pymupdf>=1.25,<2",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<2",
  "neo4j>=5.26,<7",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "reportlab>=4.4,<5", "Pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
